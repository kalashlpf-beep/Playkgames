name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Create app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir app
          cd app
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/app@8 @capacitor/browser@8 @capacitor-firebase/messaging@8 firebase
          npm install sharp
          mkdir www
          echo '<html><body style="background:#090b0d"></body></html>' > www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "app.floot.u300ccfd9db194dc09405b54ca1d70123",
            "appName": "PLAY K GAMES",
            "webDir": "www",
            "server": {
              "url": "https://playkgames.floot.app",
              "androidScheme": "https"
            },
            "plugins": {
              "FirebaseMessaging": {
                "presentationOptions": ["badge", "sound", "alert"]
              }
            }
          }
          EOF
          npx cap add android
          cat > gen.js <<'GEN'
          const sharp = require('sharp');
          const fs = require('fs');
          const res = 'android/app/src/main/res';
          const dens = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          async function mk(w, h, s, out) {
            const logo = await sharp('../splash.png').extract({ left: 616, top: 616, width: 1500, height: 1500 }).resize(s, s).toBuffer();
            await sharp({ create: { width: w, height: h, channels: 3, background: '#000000' } }).composite([{ input: logo, gravity: 'center' }]).png().toFile(out);
          }
          (async () => {
            for (const d in dens) {
              const dir = res + '/mipmap-' + d;
              fs.mkdirSync(dir, { recursive: true });
              await sharp('../icon-only.png').resize(dens[d], dens[d]).toFile(dir + '/ic_launcher.png');
              await sharp('../icon-only.png').resize(dens[d], dens[d]).toFile(dir + '/ic_launcher_round.png');
            }
            fs.rmSync(res + '/mipmap-anydpi-v26', { recursive: true, force: true });
            fs.mkdirSync(res + '/drawable', { recursive: true });
            await mk(1080, 1920, 900, res + '/drawable/splash_image.png');
            for (const d of fs.readdirSync(res)) {
              if (d.startsWith('drawable') && fs.existsSync(res + '/' + d + '/splash.png')) {
                const land = d.includes('land');
                await mk(land ? 1920 : 1080, land ? 1080 : 1920, land ? 700 : 900, res + '/' + d + '/splash.png');
              }
            }
          })();
          GEN
          node gen.js
          mkdir -p android/app/src/main/res/raw
          cp ../intro.mp4 android/app/src/main/res/raw/intro.mp4
          find android/app/src/main/java -name 'MainActivity.*' -delete
          mkdir -p android/app/src/main/java/app/floot/u300ccfd9db194dc09405b54ca1d70123
          cat > android/app/src/main/java/app/floot/u300ccfd9db194dc09405b54ca1d70123/MainActivity.java <<'JAVA'
          package app.floot.u300ccfd9db194dc09405b54ca1d70123;

          import android.graphics.Color;
          import android.media.MediaPlayer;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.VideoView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            private FrameLayout overlay;

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              overlay = new FrameLayout(this);
              overlay.setBackgroundColor(Color.BLACK);
              overlay.setClickable(true);

              final VideoView video = new VideoView(this);
              overlay.addView(video, new FrameLayout.LayoutParams(-1, -1, Gravity.CENTER));

              final ImageView splash = new ImageView(this);
              splash.setScaleType(ImageView.ScaleType.CENTER_CROP);
              splash.setImageResource(getResources().getIdentifier("splash_image", "drawable", getPackageName()));
              overlay.addView(splash, new FrameLayout.LayoutParams(-1, -1));

              Button skip = new Button(this);
              skip.setText("Passer");
              skip.setTextColor(Color.WHITE);
              skip.setBackgroundColor(0x88000000);
              FrameLayout.LayoutParams sp = new FrameLayout.LayoutParams(-2, -2, Gravity.TOP | Gravity.END);
              sp.setMargins(0, 120, 32, 0);
              overlay.addView(skip, sp);
              skip.setOnClickListener(x -> closeOverlay(video));

              addContentView(overlay, new ViewGroup.LayoutParams(-1, -1));

              int id = getResources().getIdentifier("intro", "raw", getPackageName());
              video.setVideoURI(Uri.parse("android.resource://" + getPackageName() + "/" + id));
              video.setOnPreparedListener(mp -> splash.postDelayed(() -> splash.setVisibility(View.GONE), 500));
              video.setOnInfoListener((mp, what, extra) -> {
                if (what == MediaPlayer.MEDIA_INFO_VIDEO_RENDERING_START) {
                  splash.setVisibility(View.GONE);
                }
                return true;
              });
              video.setOnCompletionListener(mp -> closeOverlay(video));
              video.setOnErrorListener((mp, what, extra) -> {
                closeOverlay(video);
                return true;
              });
              video.start();
            }

            private void closeOverlay(VideoView video) {
              if (overlay == null) return;
              try {
                video.stopPlayback();
              } catch (Exception e) {
              }
              if (overlay.getParent() != null) {
                ((ViewGroup) overlay.getParent()).removeView(overlay);
              }
              overlay = null;
            }
          }
          JAVA
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: PLAY K GAMES ${{ github.run_number }}
          files: app/android/app/build/outputs/apk/debug/app-debug.apk
