name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Create app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir app
          cd app
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/app@8 @capacitor/browser@8 @capacitor-firebase/messaging@8 firebase
          mkdir www
          echo '<html><body style="background:#090b0d"></body></html>' > www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "app.floot.u300ccfd9db194dc09405b54ca1d70123",
            "appName": "PLAY K GAMES",
            "webDir": "www",
            "server": {
              "url": "https://playkgames.floot.app",
              "androidScheme": "https"
            },
            "plugins": {
              "FirebaseMessaging": {
                "presentationOptions": ["badge", "sound", "alert"]
              }
            }
          }
          EOF
          npx cap add android
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: PLAY K GAMES ${{ github.run_number }}
          files: app/android/app/build/outputs/apk/debug/app-debug.apk
